name: Build Trident (Unsigned IPA)

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned iOS app
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select latest available Xcode
        run: |
          set -e
          LATEST_XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$LATEST_XCODE" ]; then
            echo "No /Applications/Xcode_*.app found, falling back to the default selection."
            sudo xcode-select -p
          else
            echo "Selecting $LATEST_XCODE"
            sudo xcode-select -switch "$LATEST_XCODE/Contents/Developer"
          fi

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew list xcodegen &>/dev/null || brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build for generic iOS device (no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project Trident.xcodeproj \
            -scheme Trident \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Trident.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ENABLE_ON_DEMAND_RESOURCES=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            clean archive

      - name: Verify archive was created
        run: |
          if [ ! -d "$RUNNER_TEMP/Trident.xcarchive" ]; then
            echo "Archive was not created. Check the build log above for compiler errors."
            exit 1
          fi
          echo "Archive created at $RUNNER_TEMP/Trident.xcarchive"

      - name: Package unsigned IPA
        run: |
          set -e
          PAYLOAD_DIR="$RUNNER_TEMP/Payload"
          mkdir -p "$PAYLOAD_DIR"
          APP_PATH=$(find "$RUNNER_TEMP/Trident.xcarchive/Products/Applications" -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app product found in archive."
            exit 1
          fi
          cp -R "$APP_PATH" "$PAYLOAD_DIR/"
          cd "$RUNNER_TEMP"
          zip -r -y "Trident-unsigned.ipa" "Payload" > /dev/null
          mkdir -p "$GITHUB_WORKSPACE/build-output"
          cp "$RUNNER_TEMP/Trident-unsigned.ipa" "$GITHUB_WORKSPACE/build-output/"

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Trident-unsigned-ipa
          path: build-output/Trident-unsigned.ipa
          if-no-files-found: error

      - name: Upload full .xcarchive (for debugging / manual re-signing)
        uses: actions/upload-artifact@v4
        with:
          name: Trident-xcarchive
          path: ${{ runner.temp }}/Trident.xcarchive
          if-no-files-found: warn
