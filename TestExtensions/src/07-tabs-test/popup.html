<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>body{font-family:-apple-system,sans-serif;background:#1c1c26;color:white;padding:20px;}
li{margin-bottom:4px;font-size:13px;}</style>
</head>
<body>
  <h1>Tabs Test</h1>
  <ul id="list">Loading tabs...</ul>
  <script>
    chrome.tabs.query({}).then(function(tabs) {
      var list = document.getElementById('list');
      list.innerHTML = '';
      tabs.forEach(function(tab) {
        var li = document.createElement('li');
        li.textContent = (tab.active ? '\u25CF ' : '') + tab.title;
        list.appendChild(li);
      });
    });
  </script>
</body></html>
